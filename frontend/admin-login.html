<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Loyola Admissions</title>
  <style>
    :root {
      --green-900: #173f2a;
      --green-800: #1d5335;
      --green-700: #2a7048;
      --ink-900: #11251a;
      --ink-600: #4f6459;
      --surface: #ffffff;
      --surface-soft: #f4f8f5;
      --border: rgba(23, 63, 42, 0.18);
      --focus: rgba(42, 112, 72, 0.24);
      --shadow: 0 18px 42px rgba(17, 37, 26, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Verdana, sans-serif;
      background:
        radial-gradient(circle at 86% 12%, rgba(201, 167, 75, 0.16), transparent 26%),
        radial-gradient(circle at 12% 12%, rgba(42, 112, 72, 0.14), transparent 30%),
        linear-gradient(145deg, #edf4ef, #e7f0ea);
      color: var(--ink-900);
    }

    .wrap { max-width: 720px; margin: 48px auto; padding: 0 18px; }

    .card {
      background: var(--surface);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    h1 {
      margin: 0 0 6px;
      font-family: Georgia, serif;
      color: var(--green-900);
      letter-spacing: 0.2px;
    }

    p { margin: 0 0 18px; color: var(--ink-600); line-height: 1.6; }

    .field { margin-bottom: 12px; }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 700;
      color: var(--green-900);
      font-size: 0.92rem;
    }

    input {
      width: 100%;
      min-height: 46px;
      padding: 11px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font: inherit;
      color: var(--ink-900);
      background: var(--surface);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus {
      border-color: var(--green-700);
      box-shadow: 0 0 0 4px var(--focus);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
      align-items: center;
    }

    button {
      background: linear-gradient(145deg, var(--green-900), var(--green-700));
      color: #fff;
      border: 0;
      border-radius: 12px;
      min-height: 46px;
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 26px rgba(23, 63, 42, 0.22);
    }

    button:disabled { opacity: 0.65; }

    .link {
      color: var(--green-900);
      text-decoration: none;
      font-weight: 700;
      border: 1px solid rgba(23, 63, 42, 0.14);
      border-radius: 10px;
      padding: 10px 12px;
      background: var(--surface-soft);
    }

    .msg { display: none; margin-top: 14px; padding: 10px 12px; border-radius: 10px; }
    .ok { background: #e5f3e9; color: #16452d; border: 1px solid #bfdac7; }
    .err { background: #fdeceb; color: #8b2f2a; border: 1px solid #efc3bf; }

    @media (max-width: 760px) {
      .wrap { margin-top: 28px; }
      .card { padding: 20px; }
      .actions button,
      .actions .link { width: 100%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Admin Login</h1>
      <p>Only Loyola admin officers can access the dashboard.</p>
      <form id="adminForm">
        <div class="field">
          <label for="username">Admin User ID</label>
          <input id="username" value="Loyola admin" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" required>
        </div>
        <div class="actions">
          <button id="submitBtn" type="submit">Open Dashboard</button>
          <a class="link" href="student-register.html">Student Registration</a>
          <a class="link" href="student-login.html">Student Login</a>
          <a class="link" href="index.html">Home</a>
        </div>
      </form>
      <div id="ok" class="msg ok"></div>
      <div id="err" class="msg err"></div>
    </div>
  </div>
  <script src="config.js"></script>
  <script>
    const SESSION_KEY = 'loyola_portal_session';
    let resolvedApiBaseUrl = null;
    const normalizeBaseUrl = (url) => String(url || '').trim().replace(/\/+$/, '');
    function getApiCandidates() {
      const out = [];
      if (Array.isArray(window.API_BASE_URLS)) window.API_BASE_URLS.forEach((u) => { const n = normalizeBaseUrl(u); if (n) out.push(n); });
      const single = normalizeBaseUrl(window.API_BASE_URL); if (single) out.push(single);
      if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        out.push('http://127.0.0.1:8002'); out.push('http://127.0.0.1:8001');
      }
      return [...new Set(out)].filter(Boolean);
    }
    async function canReachApi(base) { try { const r = await fetch(`${base}/health`); return r.ok; } catch { return false; } }
    async function resolveApiBaseUrl() {
      if (resolvedApiBaseUrl) return resolvedApiBaseUrl;
      for (const c of getApiCandidates()) {
        if (await canReachApi(c)) {
          resolvedApiBaseUrl = c;
          if (typeof window.showApiDebug === 'function') window.showApiDebug(c, 'probe');
          return c;
        }
      }
      const fallback = getApiCandidates()[0] || '';
      if (typeof window.showApiDebug === 'function') window.showApiDebug(fallback, 'fallback');
      return fallback;
    }
    async function apiFetch(path, options = {}) {
      const base = await resolveApiBaseUrl(); if (!base) throw new Error('Backend URL not configured');
      const headers = new Headers(options.headers || {});
      if (!headers.has('Content-Type') && options.body) headers.set('Content-Type', 'application/json');
      const res = await fetch(`${base}${path}`, { ...options, headers });
      const ct = res.headers.get('content-type') || ''; const data = ct.includes('application/json') ? await res.json() : await res.text();
      if (!res.ok) throw new Error((data && data.detail) || data || `HTTP ${res.status}`);
      return data;
    }
    function show(id, msg) { const ok=document.getElementById('ok'); const err=document.getElementById('err'); ok.style.display='none'; err.style.display='none'; if (!id) return; const n=document.getElementById(id); n.textContent=msg; n.style.display='block'; }
    document.getElementById('adminForm').addEventListener('submit', async (e) => {
      e.preventDefault(); const btn=document.getElementById('submitBtn'); const old=btn.textContent; btn.disabled=true; btn.textContent='Authenticating...'; show(null, '');
      try {
        const payload = { username: document.getElementById('username').value.trim(), password: document.getElementById('password').value };
        const data = await apiFetch('/admin/login', { method: 'POST', body: JSON.stringify(payload) });
        localStorage.setItem(SESSION_KEY, JSON.stringify({ token: data.token, role: 'admin', account: data.account }));
        show('ok', 'Admin authenticated. Opening dashboard...');
        setTimeout(() => { window.location.href='admin.html'; }, 300);
      } catch (err) { show('err', err.message || 'Admin login failed'); }
      finally { btn.disabled=false; btn.textContent=old; }
    });
  </script>
</body>
</html>
